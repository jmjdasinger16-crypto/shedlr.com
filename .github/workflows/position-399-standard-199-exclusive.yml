name: Replace all Shedlr pricing with $399

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace all $199 pricing references
        shell: python
        run: |
          from pathlib import Path
          import re

          allowed = {'.html', '.js', '.json', '.md', '.txt', '.xml'}
          skip = {'.git','node_modules','.github'}
          changed=[]

          def update(text):
              # Replace displayed/public pricing.
              text = text.replace('$199.00', '$399.00')
              text = text.replace('$199', '$399')

              # Replace structured plan/offer numeric values while avoiding unrelated numbers.
              text = re.sub(r'("price"\s*:\s*")199(?:\.00)?("\s*,)', r'\g<1>399.00\2', text)
              text = re.sub(r'("plan_monthly"\s*:\s*)199(?:\.0+)?\b', r'\g<1>399', text)
              text = re.sub(r'("plan_price"\s*:\s*)199(?:\.0+)?\b', r'\g<1>399', text)
              text = re.sub(r'("monthly_price"\s*:\s*)199(?:\.0+)?\b', r'\g<1>399', text)
              text = re.sub(r'("price_monthly"\s*:\s*)199(?:\.0+)?\b', r'\g<1>399', text)

              # Remove any now-nonsensical promotional/exclusive language left from the prior positioning pass.
              replacements = [
                  ('Claim the $399/month offer', 'Start for $399/month'),
                  ('Claim the $399/month exclusive rate', 'Start for $399/month'),
                  ('Claim the $399/month rate', 'Start for $399/month'),
                  ('Claim exclusive rate &mdash; $399/month', 'Continue to secure checkout &mdash; $399'),
                  ('exclusive $399/month rate', '$399/month rate'),
                  ('exclusive $399/month offer', '$399/month plan'),
                  ('exclusive promotional rate of $399 per month', 'rate of $399 per month'),
                  ('eligible customers may receive an exclusive promotional rate of $399 per month', 'the monthly subscription rate is $399 per month'),
                  ('Standard rate: $399/month. Exclusive offer: $399/month.', '$399 per month.'),
                  ('standard rate $399/month', '$399/month'),
                  ('Standard rate $399 / month', '$399 / month'),
                  ('normally $399/month', '$399/month'),
                  ('with an exclusive $399/month offer available', ''),
                  ('Exclusive rate billed monthly at $399 ($399/month).', 'Billed monthly at $399.'),
                  ('Exclusive rate billed monthly at $399 (standard rate $399/month).', 'Billed monthly at $399.'),
                  ('<span>exclusive monthly rate</span>', '<span>per month</span>'),
                  ('<dt>Standard rate</dt><dd>$399 / month</dd>\n        <div class="row"><dt>Exclusive offer</dt><dd>$399 / month</dd></div>', '<dt>Monthly plan</dt><dd>$399 / month</dd>'),
                  ('$399 standard · $399 exclusive offer', '$399 per month'),
                  ('Lock in the exclusive $399 monthly rate,', 'Flat monthly pricing,'),
                  ('$399/month standard · exclusive $399 offer available', '$399/month · flat monthly pricing'),
              ]
              for old,new in replacements:
                  text = text.replace(old,new)

              # General cleanup for duplicated wording after replacement.
              text = text.replace('$399 per month standard rate', '$399 per month')
              text = text.replace('$399/month standard', '$399/month')
              text = text.replace('exclusive $399', '$399')
              text = text.replace('Exclusive $399', '$399')
              text = text.replace('standard $399', '$399')
              text = text.replace('Standard $399', '$399')
              text = text.replace('$399 / month\n        <div class="price-then">$399 / month</div>', '$399 / month')
              text = re.sub(r'\s{2,}', ' ', text) if False else text
              return text

          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed or any(part in skip for part in p.parts):
                  continue
              old=p.read_text(encoding='utf-8')
              new=update(old)
              if new != old:
                  p.write_text(new,encoding='utf-8')
                  changed.append(str(p))

          leftovers=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed or any(part in skip for part in p.parts):
                  continue
              txt=p.read_text(encoding='utf-8')
              if '$199' in txt or re.search(r'("(?:price|plan_monthly|plan_price|monthly_price|price_monthly)"\s*:\s*"?)199(?:\.00)?\b', txt):
                  leftovers.append(str(p))

          print('Changed files:')
          for p in changed: print(' -',p)
          if leftovers:
              raise SystemExit('Remaining $199 pricing references: ' + ', '.join(leftovers))

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No pricing changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Replace all $199 pricing with $399'
          git push
